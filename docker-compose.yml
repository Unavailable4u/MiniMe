# MiniMe -- default compose file: PRODUCTION-LIKE.
#
# Every service runs from its own self-contained image, exactly as it would
# when deployed: no source bind-mounts, no reload. This is deliberately the
# default, so forgetting a flag gives you the safe thing, not the dev thing.
#
#   docker compose up --build
#
# For local development (backend source mounted in, live reload), layer the
# dev overlay on top -- see docker-compose.dev.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    # Loads every var from your existing backend/.env (SUPABASE_*, SENTRY_DSN,
    # DATABASE_URL, GROQ_API_KEY, etc.) — nothing duplicated here, so this
    # file stays correct even as you add more keys to .env.example later.
    env_file:
      - backend/.env
    volumes:
      # Runtime state the backend writes next to its code (cwd-relative):
      #   /app/data -- graph edges, study/quiz progress, node summaries,
      #                notebook exports (data/exports), ...
      #   /app/apps -- projects generated by the code agents
      # These are named volumes, not bind mounts, so state survives
      # `docker compose down` / image rebuilds without the host directory
      # shadowing the image's code. Docker seeds a new named volume from the
      # image, including ownership, so the non-root `app` user can write to
      # them (backend.Dockerfile creates both dirs before the chown).
      - backend_data:/app/data
      - backend_apps:/app/apps
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - frontend/.env.local
    environment:
      # So the frontend can reach the backend by service name inside the
      # Docker network, not localhost — adjust if your frontend code reads
      # a different var name for the API base URL.
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  backend_apps:
