[tool.ruff]
# B3 (CI lint job): now tracking ruff's zero-config default rule set
# instead of pinning E4/E7/E9/F. Re-measured on 2026-08-25 (ruff 0.16.4):
# 1680 findings under the default set vs. 25 under the old pinned
# selection, 868 of which are auto-fixable. Adopted in two batches: a
# mechanical batch (import sorting, deprecated-typing syntax, etc.)
# applied via `ruff check --fix`, and a follow-up manual-triage batch
# (blind-except, implicit-optional, and similar findings that need a
# per-site judgment call, tracked separately).
target-version = "py311"
