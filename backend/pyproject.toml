[tool.ruff]
# B3 (CI lint job): pinned explicitly rather than relying on ruff's
# zero-config default, which now enables nearly every rule family
# (confirmed: 955 findings on this repo vs. 106 under the selection
# below). E4/E7/E9/F is the classic "pycodestyle errors + syntax errors +
# Pyflakes" baseline — real bugs (unused imports, undefined names,
# redefinitions) without style-only noise. Revisit deliberately, not by
# ruff-version upgrade side effect.
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
