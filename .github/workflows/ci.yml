# .github/workflows/ci.yml — Master Guide B3.
#
# Test + lint jobs. secrets-scan is a deliberate follow-up: it currently
# still lives in security-scan.yml (B2) — fold gitleaks/semgrep in here
# and delete that file once this workflow is confirmed green.
#
# Lint rules are pinned explicitly in backend/pyproject.toml
# ([tool.ruff.lint] select = E4/E7/E9/F) rather than left to ruff's
# zero-config default, which as of ruff 0.16 enables nearly every rule
# family (955 findings on this repo vs. 106 under the pinned selection).
name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: pytest tests/unit tests/integration -v
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff
      - run: ruff check .
