# .github/workflows/ci.yml — Master Guide B3.
#
# Test + lint + secrets-scan. gitleaks/semgrep were folded in here from
# security-scan.yml (B2), which is now deleted — this is the merge that
# file's header comment flagged as pending.
#
# Lint rules are pinned explicitly in backend/pyproject.toml
# ([tool.ruff.lint] select = E4/E7/E9/F) rather than left to ruff's
# zero-config default, which as of ruff 0.16 enables nearly every rule
# family (955 findings on this repo vs. 106 under the pinned selection).
name: CI
on: [push, pull_request]

permissions:
  contents: read
  security-events: write  # required for the semgrep SARIF upload step

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: pytest tests/unit tests/integration -v
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: pip install ruff
      - run: ruff check .
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # gitleaks needs full history, not just the latest commit
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - run: pip install semgrep
      # `semgrep ci` requires a Semgrep AppSec Platform login -- and per
      # Semgrep's own CI env var docs, SEMGREP_RULES is *also* documented
      # as "you must have a Semgrep AppSec Platform account to use this
      # environment variable" (with an explicit caution against setting it
      # without SEMGREP_APP_TOKEN). This job ran `semgrep ci` with
      # SEMGREP_RULES set but no token anywhere -- an unsupported
      # combination per Semgrep's own docs, and the most likely source of
      # the "Semgrep OSS is reporting warnings/errors" banner on the
      # Security tab's Code scanning page (semgrep.dev's own domain isn't
      # reachable from this sandbox to confirm the exact failure text
      # GitHub's runners would see, but the config mismatch itself is
      # documented, not guessed). `semgrep scan` is Semgrep's own
      # documented command for this case (community/OSS rules, no
      # account) -- --config=auto is a flag understood the same way by
      # both commands, so this doesn't change which rules run or what
      # gets scanned, just drops the CI-auth machinery that was never
      # going to work unauthenticated anyway. Add a SEMGREP_APP_TOKEN
      # secret (and switch back to `semgrep ci`) later if/when premium
      # rules or PR-comment integration are wanted.
      - run: semgrep scan --config=auto --sarif --output=semgrep.sarif
        continue-on-error: true  # upload the SARIF even if semgrep exits non-zero on findings
      - uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          sarif_file: semgrep.sarif

  promptfoo:
    # D2 patch 6 — Role Library regression evals (backend/evals/promptfoo).
    #
    # Two runtimes this job needs that no other job here does yet:
    #   - Node: promptfoo itself, plus the Node-side llm-rubric grading
    #     call. Verified directly against the pinned version's own
    #     installed package.json (backend/evals/promptfoo/package.json's
    #     devDependencies: promptfoo 0.122.0) rather than trusting memory:
    #     engines.node is ">=22.22.0". There is no separate ^20.20.0 path
    #     for THIS version -- that floor may hold for some other promptfoo
    #     release, but 0.122.0's own package.json only states the one
    #     constraint. Pinned to the exact floor version below (not a
    #     floating "22" tag) so a future runner-image default bump can't
    #     silently drop under it.
    #   - Python 3.11: role_provider.py is a promptfoo Python provider
    #     that imports eo/agents/utils from backend/ -- same pin and same
    #     requirements.txt install as the `test`/`lint` jobs above, so
    #     imports resolve identically to what those jobs already verify.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    # First-pass tradeoff, called out rather than silently accepted: as
    # configured today this can't tell "a role's prompt actually
    # regressed" apart from "grading/chain infra was misconfigured" (a
    # missing secret, an unreachable Upstash instance, etc.) -- both land
    # as the same non-blocking red at the job level. Acceptable for a
    # first pass per the agreed plan; revisit (e.g. a follow-up that
    # greps the JSON output for the two error shapes role_provider.py and
    # promptfoo's own OPENAI/GROQ-key errors produce, and only lets a
    # real generation failure block the build) once there's enough real
    # CI history to know how often that distinction actually matters.
    defaults:
      run:
        working-directory: backend/evals/promptfoo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - name: Install backend Python deps (role_provider.py imports eo/agents/utils)
        working-directory: backend
        run: pip install -r requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.0"  # exact floor from promptfoo 0.122.0's own engines.node — see job comment above
          cache: "npm"
          cache-dependency-path: backend/evals/promptfoo/package-lock.json
      - run: npm ci

      - name: Run Role Library promptfoo evals
        run: npm run eval:ci
        env:
          # --- envPath is a local-only convenience, not usable here ---
          # promptfooconfig.yaml's commandLineOptions.envPath points at
          # ../../.env (backend/.env), which simply doesn't exist in a CI
          # checkout. Rather than special-casing that config file for CI,
          # every var it would have loaded is exported directly below
          # instead. Confirmed non-conflicting by reading promptfoo's own
          # setupEnv() (wraps `dotenv.config`, which no-ops harmlessly
          # against a missing path and never overrides a var already set
          # in the process env) -- so this doesn't need a placeholder
          # backend/.env file or a config edit to coexist with envPath.

          # --- CI-only key pool (patch 9) ---
          # Was: this job exported the full production account pool
          # (GROQ_API_KEY_6-14, GROQ_RESERVE_1/2, SGA_GROQ_1-3,
          # CEREBRAS_API_KEY_1, MISTRAL_API_KEY, GEMINI_API_KEY_1) as
          # job-level secrets, reasoned about in the comment that used to
          # sit here as "same pool production uses, not CI-only reserved
          # keys". Reversed that decision now that CI_* secrets actually
          # exist (repo Settings -> Secrets and variables -> Actions):
          # production-key reuse in CI was never actually required by
          # anything below, and splitting the blast radius of a leaked
          # CI credential from production quota/billing is worth the
          # one-time setup cost.
          #
          # Only 2 CI-scoped Groq keys exist, nowhere near the ~20-account
          # production pool _build_live_chain() ranks by quota when Redis
          # IS reachable (see the UPSTASH comment below) -- with a fresh
          # CI Upstash instance every account ties at 0% usage, so quota
          # ranking among a pool where only 2 of ~20 key_envs actually
          # have a CI credential is arbitrary, not deterministic. Rather
          # than exporting these 2 keys into that pool under production
          # key_env names (e.g. GROQ_API_KEY_6) and hoping quota ranking
          # happens to pick one of them, tests/contradiction_detector.yaml
          # now sets `provider_override: "groq"` on both cases -- see
          # that file's patch 9 comment -- which makes role_provider.py
          # skip chain-building entirely via PROVIDER_OVERRIDE_DEFAULTS
          # (already in this file from patch 5's provider comparison),
          # for a single deterministic step instead of a pool draw.
          #
          # Split by purpose rather than reusing one key for both calls
          # promptfoo makes per case, so a grading call and a generation
          # call in flight together don't compete for the same key's
          # per-minute rate limit:
          #   - CI_GROQ_API_KEY_1 grades (promptfooconfig.yaml's
          #     defaultTest llm-rubric provider, Node-side, now reads
          #     GROQ_API_KEY_GRADING -- see that file's patch 9 comment).
          #   - CI_GROQ_API_KEY_2 generates (role_provider.py's
          #     PROVIDER_OVERRIDE_DEFAULTS["groq"]["key_env"], still
          #     "GROQ_API_KEY" -- unchanged name, just a CI-scoped value
          #     now instead of a production one).
          GROQ_API_KEY_GRADING: ${{ secrets.CI_GROQ_API_KEY_1 }}
          GROQ_API_KEY: ${{ secrets.CI_GROQ_API_KEY_2 }}

          # --- UPSTASH secrets: still not optional for this suite ---
          # Unchanged reasoning from before (see the file history for
          # the full version): the BRIEF lookup (_get_brief_live_or_seed())
          # degrades fine to ROLE_PROMPTS_SEED with no reachable Redis,
          # but real Upstash creds are still what let CI test against
          # the actual live-hired brief instead of always falling back
          # to seed. Chain-building itself no longer depends on these
          # for contradiction_detector specifically now that its cases
          # force provider_override -- but the brief lookup still does,
          # and future case files that DON'T set provider_override will
          # still need Redis reachable for anything beyond a seed-brief
          # run. Now CI-scoped rather than production Upstash creds.
          UPSTASH_REDIS_REST_URL: ${{ secrets.CI_UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.CI_UPSTASH_REDIS_REST_TOKEN }}

          # --- per-test timeout (this patch's new addition) ---
          # generate_text() can walk up to MAX_CHAIN_STEPS_CEILING (6)
          # live chain steps before giving up on a single role_provider.py
          # call. Verified PROMPTFOO_EVAL_TIMEOUT_MS against promptfoo
          # 0.122.0's own installed source
          # (node_modules/promptfoo/dist/src/evaluator-*.js:
          # `context.options.timeoutMs || getEvalTimeoutMs()`, where
          # getEvalTimeoutMs() reads exactly this env var) rather than
          # guessing a config key from docs/memory -- it's real and
          # currently supported in this pinned version. 120s/test leaves
          # room for a multi-step chain walk without one hung case
          # stalling the whole job. PROMPTFOO_MAX_EVAL_TIME_MS is the
          # same package's whole-run cap (same source file), set here as
          # a second backstop underneath this job's own timeout-minutes
          # above.
          PROMPTFOO_EVAL_TIMEOUT_MS: "120000"
          PROMPTFOO_MAX_EVAL_TIME_MS: "600000"
