# .github/workflows/security-scan.yml — Master Guide B2.
#
# Standalone for now, deliberately: B3 (full CI — tests + lint) hasn't
# been built yet in this repo. When it is, fold these two jobs into
# .github/workflows/ci.yml alongside `test` and `lint` rather than keeping
# a second workflow file — noted here so that merge isn't forgotten.
name: Security scan
on: [push, pull_request]

permissions:
  contents: read
  security-events: write  # required for the SARIF upload steps below

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs full history, not just the latest commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config=auto --sarif --output=semgrep.sarif
        env:
          # Community/OSS ruleset via `auto` needs no token. If you later
          # add a Semgrep AppSec Platform token for premium rules, wire it
          # in here as SEMGREP_APP_TOKEN — not required for this pass.
          SEMGREP_RULES: auto
        continue-on-error: true  # upload the SARIF even if semgrep exits non-zero on findings
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
